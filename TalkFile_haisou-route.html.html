<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>配送リスト(最適化)</title>
<style>
:root{--bg:#EEF1F6;--surface:#fff;--ink:#16254A;--muted:#5B6785;--line:#C9D1E3;--accent:#C0302C;--chip:#DDE4F3;--btn-bg:#16254A;--btn-ink:#fff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--surface:#18213A;--ink:#E6EBF7;--muted:#9AA6C4;--line:#2C3859;--accent:#F0706B;--chip:#25304F;--btn-bg:#E6EBF7;--btn-ink:#0F1626;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1626;--surface:#18213A;--ink:#E6EBF7;--muted:#9AA6C4;--line:#2C3859;--accent:#F0706B;--chip:#25304F;--btn-bg:#E6EBF7;--btn-ink:#0F1626;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.02em}
h2{font-size:1rem;margin:28px 0 8px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.9rem}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{min-height:140px;resize:vertical}
textarea:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:20px;padding:4px 6px 4px 14px}
.chip button{border:0;background:none;color:var(--muted);font-size:1.2rem;line-height:1;padding:4px 8px;cursor:pointer}
.add{display:flex;gap:8px}
.add input{flex:1}
.btn{display:inline-block;background:var(--btn-bg);color:var(--btn-ink);border:0;border-radius:6px;padding:12px 18px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;text-align:center}
.btn.sec{background:none;color:var(--ink);border:2px solid var(--line);font-weight:400}
.sum{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 4px}
.group{background:var(--surface);border:2px solid var(--line);border-radius:6px;margin:14px 0;overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid var(--line);font-weight:700}
ol{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.n{flex:none;min-width:2.2em;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.t{flex:1;min-width:0;overflow-wrap:anywhere}
.nm{color:var(--muted);font-size:.9rem}
.tag{font-size:.8rem;color:var(--accent)}
.out li{color:var(--muted)}
.empty{color:var(--muted);border:2px dashed var(--line);border-radius:6px;padding:18px}
summary{cursor:pointer;color:var(--muted);padding:8px 0}
.act{display:flex;gap:6px;margin-top:6px}
.act button{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer}
.ei{margin-top:6px}
.mv{flex:none;display:flex;gap:4px;align-items:flex-start}
.mv button{min-width:40px;min-height:40px;border:2px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.qa{display:flex;gap:8px;margin:0}
.qa select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:10px 8px;max-width:40%}
.qa input{flex:1;min-width:0}
</style>
</head>
<body>
<main>
<h1>配送リスト</h1>
<p class="sub">住所を入れると、担当の町だけを番地順に並べ、地図リンクを作ります。</p>

<h2>住所を1件ずつ入れる</h2>
<form class="qa" onsubmit="return false"><select id="qt" aria-label="町"></select><input id="qn" placeholder="番地 例: 59-16" aria-label="番地"><button class="btn" id="qb" type="button">追加</button></form>
<h2>住所リスト</h2>
<textarea id="src" placeholder="1行に1件。「住所 | 受取人」の形で貼り付け&#10;神奈川県川崎市川崎区日進町59-16 | 新菱冷熱工業(株)" aria-label="住所リスト"></textarea>
<div style="margin-top:8px"><button class="btn sec" id="clear">リストを消す</button></div>

<h2>担当の町</h2>
<div class="chips" id="chips"></div>
<form class="add" id="addf" onsubmit="return false">
<input id="newTown" placeholder="町名を追加(例: 渡田)" aria-label="町名を追加">
<button class="btn" id="addBtn" type="button">追加</button>
</form>

<h2>出発地点(営業所の住所・任意)</h2>
<input id="depot" placeholder="例: 神奈川県川崎市川崎区日進町1-1" aria-label="出発地点">
<div style="margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn" id="opt" type="button">最適な順番に並べる</button><span id="ost" class="sub" style="margin:0" aria-live="polite"></span></div>
<div id="result"></div>
</main>
<script>
let lastStops=[],lastShown=[],optOrder=null,curLines=[],editKey=null,outOpen=false;
const rowIdx=new Map();
const DEF=["堤根","下並木","池田町","日進町"];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let towns=store.get("towns",DEF);
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/(\d)[－―−‐ー–—の](?=\d)/g,"$1-").replace(/　/g," ");

function parse(line){
  const parts=line.split(/[|\t]/).map(x=>x.trim());
  const name=parts[1]||"";
  const addr=norm(parts[0]).replace(/^〒?\d{3}-?\d{4}\s*/,"").replace(/\s+/g," ");
  let ti=-1,pos=0;
  for(let i=0;i<towns.length;i++){const p=addr.indexOf(towns[i]);if(p>-1){ti=i;pos=p+towns[i].length;break}}
  if(ti<0)return{addr,name,out:true};
  const rest=addr.slice(pos).trim().split(" ")[0];
  const nums=(rest.match(/\d+/g)||[]).map(Number);
  return{addr,name,ti,nums,base:"神奈川県川崎市川崎区"+towns[ti]+rest,label:towns[ti]+rest};
}
const isAddr=s=>/[都道府県].*[市区郡]|[市区町村].*\d/.test(norm(s));
function toRows(lines){
  const rows=[];
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    if(/[|\t]/.test(l)){const r=parse(l);r.idx=i;rows.push(r);continue}
    if(!isAddr(l))continue;
    const nx=lines[i+1]||"",nn=norm(nx);
    const okName=nx.length>=2&&!isAddr(nx)&&!/^[\d\s\-:：]/.test(nn)&&!/^(TEL|〒|注文|型式)/i.test(nn)&&nx!=="様";
    {const r=parse(l+(okName?" | "+nx.replace(/\s*様$/,"").trim():""));r.idx=i;rows.push(r)}
  }
  return rows;
}
function cmp(a,b){
  if(a.ti!==b.ti)return a.ti-b.ti;
  const n=Math.max(a.nums.length,b.nums.length);
  for(let k=0;k<n;k++){const d=(a.nums[k]??-1)-(b.nums[k]??-1);if(d)return d}
  return 0;
}
function mapUrl(chunk,origin){
  const dest=chunk[chunk.length-1].base;
  const wp=chunk.slice(0,-1).map(s=>s.base).join("|");
  return "https://www.google.com/maps/dir/?api=1"+(origin?"&origin="+encodeURIComponent(origin):"")+"&destination="+encodeURIComponent(dest)+(wp?"&waypoints="+encodeURIComponent(wp):"")+"&travelmode=driving";
}
function render(){
  const text=$("src").value;
  store.set("text",text);
  curLines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const rows=toRows(curLines);
  const outs=rows.filter(r=>r.out);
  const merged=new Map();
  rows.filter(r=>!r.out).sort(cmp).forEach(r=>{
    const m=merged.get(r.base);
    if(m){m.idxs.push(r.idx);m.count++;if(r.name&&!m.names.includes(r.name))m.names.push(r.name)}
    else merged.set(r.base,{...r,count:1,idxs:[r.idx],names:r.name?[r.name]:[]});
  });
  const stops=[...merged.values()];
  lastStops=stops.slice();
  rowIdx.clear();stops.forEach(s=>rowIdx.set(s.base,s.idxs));outs.forEach(o=>rowIdx.set("out:"+o.idx,[o.idx]));
  if(optOrder)stops.sort((a,b)=>(optOrder.get(a.base)??1e9)-(optOrder.get(b.base)??1e9));
  lastShown=stops;
  const res=$("result");
  if(!rows.length){res.innerHTML='<h2>配送順</h2><div class="empty">住所を貼り付けると、ここに配送順が出ます。</div>';return}
  let html='<div class="sum"><h2 style="margin:0">配送順 '+stops.length+'件</h2><button class="btn sec" id="copy">順番をコピー</button></div>';
  const SIZE=10;
  for(let i=0;i<stops.length;i+=SIZE){
    const chunk=stops.slice(i,i+SIZE);
    const origin=i>0?stops[i-1].base:"";
    html+='<section class="group"><div class="ghead"><span>'+(i+1)+'〜'+(i+chunk.length)+'件目</span><a class="btn" target="_blank" rel="noopener" href="'+mapUrl(chunk,origin)+'">地図で開く</a></div><ol>';
    chunk.forEach((s,k)=>{
      if(editKey===s.base){html+=editRow(String(i+k+1),s.label,s.names.join(" / "));return}
      html+='<li><span class="n">'+(i+k+1)+'</span><span class="t">'+esc(s.label)+(s.count>1?' <b>×'+s.count+'</b>':'')+(s.nums.length?'':' <span class="tag">番地を確認</span>')+(s.names.length?'<div class="nm">'+esc(s.names.join(" / "))+'</div>':'')+'<div class="act"><button type="button" data-e="'+esc(s.base)+'">編集</button><button type="button" data-x="'+esc(s.base)+'">削除</button></div></span><span class="mv"><button type="button" data-k="'+(i+k)+'" data-d="-1" aria-label="上へ">▲</button><button type="button" data-k="'+(i+k)+'" data-d="1" aria-label="下へ">▼</button></span></li>';
    });
    html+='</ol></section>';
  }
  if(outs.length){
    html+='<details'+((outOpen||String(editKey).startsWith("out:"))?' open':'')+' style="margin-top:20px"><summary>担当の町ではない住所 '+outs.length+'件(地図には入れていません)</summary><section class="group out"><ol>'+outs.map(o=>editKey==="out:"+o.idx?editRow("",o.addr,o.name):'<li><span class="t">'+esc(o.addr)+(o.name?'<div class="nm">'+esc(o.name)+'</div>':'')+'<div class="act"><button type="button" data-e="out:'+o.idx+'">編集</button><button type="button" data-x="out:'+o.idx+'">削除</button></div></span></li>').join("")+'</ol></section></details>';
  }
  res.innerHTML=html;
  res.querySelectorAll(".mv button").forEach(b=>b.onclick=()=>move(+b.dataset.k,+b.dataset.d));
  res.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{editKey=b.dataset.e;render()});
  res.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>delRow(b.dataset.x));
  const sv=$("esave");
  if(sv){sv.onclick=saveEdit;$("ecancel").onclick=()=>{editKey=null;render()};$("ea").focus()}
  const dt=res.querySelector("details");
  if(dt)dt.ontoggle=()=>{outOpen=dt.open};
  const cp=$("copy");
  if(cp)cp.onclick=async()=>{
    const t=stops.map((s,i)=>(i+1)+". "+s.label+(s.names.length?" "+s.names.join(" / "):"")).join("\n");
    try{await navigator.clipboard.writeText(t);cp.textContent="コピーしました"}catch(e){cp.textContent="コピーできません"}
    setTimeout(()=>{cp.textContent="順番をコピー"},1800);
  };
}
function drawChips(){
  const sel=$("qt").value;
  $("qt").innerHTML=towns.map(t=>'<option>'+esc(t)+'</option>').join("");
  if(towns.includes(sel))$("qt").value=sel;
  $("chips").innerHTML=towns.map((t,i)=>'<span class="chip">'+esc(t)+'<button type="button" data-i="'+i+'" aria-label="'+esc(t)+'を削除">×</button></span>').join("");
  $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{towns.splice(+b.dataset.i,1);store.set("towns",towns);drawChips();render()});
}
function addTown(){
  const v=$("newTown").value.trim();
  if(v&&!towns.includes(v)){towns.push(v);store.set("towns",towns);drawChips();render()}
  $("newTown").value="";
}
$("addBtn").onclick=addTown;
$("newTown").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addTown()}});
$("src").addEventListener("input",()=>{optOrder=null;$("ost").textContent="";render()});
$("clear").onclick=()=>{$("src").value="";render()};
$("src").value=store.get("text","");
drawChips();render();
function addOne(){
  const n=norm($("qn").value).trim();
  if(!n||!$("qt").value)return;
  const cur=$("src").value.trim();
  $("src").value=(cur?cur+"\n":"")+"神奈川県川崎市川崎区"+$("qt").value+n;
  $("qn").value="";$("qn").focus();optOrder=null;$("ost").textContent="";render();
}
$("qb").onclick=addOne;
$("qn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addOne()}});

const hav=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
async function geocode(q){
  const c=store.get("geo",{});
  if(c[q])return c[q];
  const r=await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q));
  const j=await r.json();
  if(!j.length)return null;
  const v={lat:j[0].geometry.coordinates[1],lon:j[0].geometry.coordinates[0]};
  c[q]=v;store.set("geo",c);return v;
}
function solve(n,dist,sd){
  if(n<2)return [...Array(n).keys()];
  const len=t=>{let s=sd?sd(t[0]):0;for(let i=1;i<t.length;i++)s+=dist(t[i-1],t[i]);return s};
  const nn=s0=>{const used=new Set([s0]),t=[s0];while(t.length<n){let b=-1,bd=1e18;const l=t[t.length-1];for(let i=0;i<n;i++)if(!used.has(i)){const d=dist(l,i);if(d<bd){bd=d;b=i}}used.add(b);t.push(b)}return t};
  let best=null,bl=1e18;
  for(let i=0;i<n;i++){const t=nn(i),l=len(t);if(l<bl){bl=l;best=t}}
  let improved=true;
  while(improved){
    improved=false;
    for(let i=0;i<n-1;i++)for(let j=i+1;j<n;j++){
      const t=best.slice(0,i).concat(best.slice(i,j+1).reverse(),best.slice(j+1));
      const l=len(t);
      if(l<bl-1e-9){best=t;bl=l;improved=true}
    }
  }
  return best;
}
async function roadMatrix(cs,start){
  const pts=(start?[start]:[]).concat(cs);
  const coords=pts.map(p=>p.lon.toFixed(6)+","+p.lat.toFixed(6)).join(";");
  const r=await fetch("https://router.project-osrm.org/table/v1/driving/"+coords+"?annotations=duration");
  const j=await r.json();
  if(j.code!=="Ok"||!j.durations)throw new Error("osrm");
  return j.durations;
}
function editRow(n,addr,name){
  return '<li><span class="n">'+n+'</span><span class="t"><input class="ei" id="ea" value="'+esc(addr)+'" aria-label="住所"><input class="ei" id="en" value="'+esc(name)+'" placeholder="受取人(任意)" aria-label="受取人"><div class="act"><button type="button" id="esave">保存</button><button type="button" id="ecancel">キャンセル</button></div></span></li>';
}
function saveEdit(){
  const key=editKey,idxs=rowIdx.get(key);
  const addr=$("ea").value.replace(/[|\n]/g," ").trim(),name=$("en").value.replace(/[|\n]/g," ").trim();
  if(!idxs||!addr)return;
  const line=addr+" | "+name,a=curLines.slice();
  idxs.forEach(ix=>{a[ix]=line});
  const nb=parse(line).base;
  if(optOrder&&nb&&optOrder.has(key))optOrder.set(nb,optOrder.get(key));
  editKey=null;
  $("src").value=a.join("\n");
  render();
}
function delRow(key){
  const idxs=rowIdx.get(key);
  if(!idxs)return;
  $("src").value=curLines.filter((_,i)=>!idxs.includes(i)).join("\n");
  render();
}
function move(k,d){
  const j=k+d;
  if(j<0||j>=lastShown.length)return;
  const a=lastShown.slice();
  [a[k],a[j]]=[a[j],a[k]];
  optOrder=new Map(a.map((s,i)=>[s.base,i]));
  render();
}
$("depot").value=store.get("depot","");
$("opt").onclick=async()=>{
  const st=lastStops,out=$("ost");
  if(!st.length){out.textContent="住所を入れてください";return}
  $("opt").disabled=true;
  try{
    const geo=new Map();let got=0;
    for(let i=0;i<st.length;i++){
      out.textContent="座標を取得中 "+(i+1)+"/"+st.length;
      let g=null;
      try{g=await geocode(st[i].base)}catch(e){}
      if(g)got++;
      geo.set(st[i].base,g);
      await new Promise(r=>setTimeout(r,120));
    }
    if(!got){out.textContent="座標を取得できませんでした。通信状態を確認してください";return}
    let start=null;
    const dq=$("depot").value.trim();
    store.set("depot",dq);
    if(dq){try{start=await geocode(dq)}catch(e){}}
    const cl=new Map(),missing=[];
    st.forEach(s=>{
      const g=geo.get(s.base);
      if(!g){missing.push(s);return}
      const k=g.lat.toFixed(5)+","+g.lon.toFixed(5);
      if(!cl.has(k))cl.set(k,{lat:g.lat,lon:g.lon,list:[]});
      cl.get(k).list.push(s);
    });
    const cs=[...cl.values()];
    let road=null,mode="直線距離";
    try{road=await roadMatrix(cs,start);mode="道路・一方通行を反映"}catch(e){}
    const off=start?1:0,fb=(p,q)=>hav(p,q)/20*3600;
    const dist=(i,j)=>{if(road){const v=road[i+off][j+off];if(v!=null)return v}return fb(cs[i],cs[j])};
    const sd=start?(i=>{if(road){const v=road[0][i+1];if(v!=null)return v}return fb(start,cs[i])}):null;
    const tour=solve(cs.length,dist,sd);
    const order=new Map();let idx=0;
    tour.forEach(i=>cs[i].list.sort(cmp).forEach(s=>order.set(s.base,idx++)));
    missing.forEach(s=>order.set(s.base,idx++));
    optOrder=order;render();
    const same=st.length-missing.length-cs.length;
    out.textContent="並べ替え完了("+mode+")"+(same>0?"。座標が同じ"+(same+0)+"件は番地順":"")+(missing.length?"。座標なし"+missing.length+"件は最後":"")+(dq&&!start?"。出発地点は見つかりませんでした":"");
  }finally{$("opt").disabled=false}
};
(function(){
  const h=location.hash;
  if(h.indexOf("#t=")!==0)return;
  try{
    const t=decodeURIComponent(h.slice(3)).trim();
    const cur=$("src").value.trim();
    $("src").value=(cur?cur+"\n":"")+t;
    history.replaceState(null,"",location.pathname+location.search);
    optOrder=null;render();
  }catch(e){}
})();
</script>
</body>
</html>
